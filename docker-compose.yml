services:
  server:
    build:
      context: ./server
      dockerfile: dockerfile
    container_name: finance_server
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 5000
    ports:
      - "4000:5000"
    volumes:
      - ./server:/app
      - /app/node_modules

  client:
    build:
      context: ./client
      dockerfile: dockerfile
    container_name: finance_client
    depends_on:
      - server
    environment:
      PORT: 5173
      REACT_APP_API_URL: http://server:5000
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules